name: Build Debug and Release

on:
  push:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Sibling repository ref (empty uses the same ref as idk_build)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux x86_64 ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk

    defaults:
      run:
        shell: bash

    env:
      IDK_SOURCE_REF: ${{ inputs.source-ref || github.ref_name }}
      IDK_PRESET: ${{ matrix.preset }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl-dev \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            wget

      # IDK_REPO_READ_TOKEN needs Contents: Read access to private sibling
      # repositories and third-party submodules. Public repositories can use
      # the built-in token. Checkout converts GitHub SSH submodule URLs to HTTPS.
      - name: Checkout idk_build and dependencies
        uses: actions/checkout@v6
        with:
          path: idk_build
          submodules: recursive
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      # Build scripts require these repositories beside idk_build. Keep their
      # refs aligned; workflow_dispatch can override the sibling ref explicitly.
      - name: Checkout idk_engine
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_engine
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_engine
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout idk_content
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_content
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_content
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout idk_game
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_game
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_game
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout libidk
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/libidk
          ref: ${{ env.IDK_SOURCE_REF }}
          path: libidk
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Build third-party dependencies
        run: ./idk_build/script/dep-build.sh

      - name: Build and install ${{ matrix.preset }}
        run: ./idk_build/script/build.sh --preset="$IDK_PRESET"

      - name: Package ${{ matrix.preset }}
        run: |
          build_dir="build-${IDK_PRESET}"

          for binary in game editor mapedit mapc; do
            test -x "$build_dir/$binary"
          done
          test -d "$build_dir/content"
          test -s "$build_dir/version.txt"
          test -s "$build_dir/steam_appid.txt"

          # Exclude intermediate build files. Tar preserves executable bits and
          # library symlinks when the artifact is downloaded and extracted.
          tar --exclude="$build_dir/cmake" \
            -czf "idk-linux-x86_64-${IDK_PRESET}.tar.gz" "$build_dir"

      - name: Upload ${{ matrix.preset }} artifact
        uses: actions/upload-artifact@v7
        with:
          path: idk-linux-x86_64-${{ matrix.preset }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
