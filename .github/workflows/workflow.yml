name: Build Release

on:
  push:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Sibling repository ref (empty uses the same ref as idk_build)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Linux x86_64 Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk

    defaults:
      run:
        shell: bash

    env:
      IDK_SOURCE_REF: ${{ inputs.source-ref || github.ref_name }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libgl-dev \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            wget

      # IDK_REPO_READ_TOKEN needs Contents: Read access to private sibling
      # repositories and third-party submodules. Public repositories can use
      # the built-in token. Checkout converts GitHub SSH submodule URLs to HTTPS.
      - name: Checkout idk_build and dependencies
        uses: actions/checkout@v6
        with:
          path: idk_build
          submodules: recursive
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      # Build scripts require these repositories beside idk_build. Keep their
      # refs aligned; workflow_dispatch can override the sibling ref explicitly.
      - name: Checkout idk_engine
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_engine
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_engine
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout idk_content
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_content
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_content
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout idk_game
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/idk_game
          ref: ${{ env.IDK_SOURCE_REF }}
          path: idk_game
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout libidk
        uses: actions/checkout@v6
        with:
          repository: IDKGameEngine/libidk
          ref: ${{ env.IDK_SOURCE_REF }}
          path: libidk
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Build third-party dependencies
        run: ./idk_build/script/dep-build.sh

      - name: Build and install Release
        run: ./idk_build/script/build.sh --preset=release

      - name: Package Release
        run: |
          # Release install rules omit the shared libraries from the local prefix.
          mkdir -p build-release/lib
          cp -a idk_build/local/lib/*.so* build-release/lib/

          for binary in game editor mapedit mapc; do
            test -x "build-release/$binary"
          done
          test -d build-release/content
          test -s build-release/version.txt
          test -s build-release/steam_appid.txt

          # Exclude intermediate build files. Tar preserves executable bits and
          # library symlinks when the artifact is downloaded and extracted.
          tar --exclude=build-release/cmake \
            -czf idk-linux-x86_64-release.tar.gz build-release

      - name: Upload Release artifact
        uses: actions/upload-artifact@v7
        with:
          path: idk-linux-x86_64-release.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
