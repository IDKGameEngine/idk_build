name: Build IDKGameEngine

on:
  push:
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-latest
    container:
      # This is the SDK image used by idk_build/script/distrobox_create.sh.
      # Pin this to an immutable digest once a SteamRT SDK version is selected.
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk

    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      IDK_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: container dependencies
        run: |
          apt-get update
          apt-get install -y \
            libgl-dev \
            pkg-config \
            cmake \
            ninja-build \
            mesa-utils \
            lsb-release \
            gpg \
            wget \
            python3-gi \
            gir1.2-gtk-3.0

      # The build script expects these repositories to be siblings of idk_build.
      # For private repositories, create IDK_REPO_READ_TOKEN: a fine-grained PAT
      # with Contents: Read permission on each of them.
      - name: checkout idk_build
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_build
          ref: ${{ env.IDK_BRANCH }}
          path: idk_build
          submodules: recursive
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: checkout idk_engine
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_engine
          ref: ${{ env.IDK_BRANCH }}
          path: idk_engine
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: checkout idk_content
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_content
          ref: ${{ env.IDK_BRANCH }}
          path: idk_content
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: checkout idk_game
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_game
          ref: ${{ env.IDK_BRANCH }}
          path: idk_game
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: checkout libidk
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/libidk
          ref: ${{ env.IDK_BRANCH }}
          path: libidk
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake \
            libgl-dev \
            ninja-build \
            pkg-config

      - name: Build third-party dependencies
        run: ./idk_build/script/dep-build.sh

      - name: Build Release
        run: ./idk_build/script/build.sh --preset=release

      - name: Upload Release Build
        uses: actions/upload-artifact@v4
        with:
          name: build-release
          path: build-release/
          if-no-files-found: error
