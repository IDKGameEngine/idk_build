name: Build IDKGameEngine

on:
  push:
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-latest
    container:
      # This is the SDK image used by idk_build/script/distrobox_create.sh.
      # Pin this to an immutable digest once a SteamRT SDK version is selected.
      image: registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      IDK_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # The build script expects these repositories to be siblings of idk_build.
      # For private repositories, create IDK_REPO_READ_TOKEN: a fine-grained PAT
      # with Contents: Read permission on each of them.
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_build
          ref: ${{ env.IDK_BRANCH }}
          path: idk_build
          submodules: recursive
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Check out engine
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_engine
          ref: ${{ env.IDK_BRANCH }}
          path: idk_engine
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Check out content
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_content
          ref: ${{ env.IDK_BRANCH }}
          path: idk_content
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Check out game
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_game
          ref: ${{ env.IDK_BRANCH }}
          path: idk_game
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Check out graphics module
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/idk_gfx
          ref: ${{ env.IDK_BRANCH }}
          path: idk_gfx
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Check out core library
        uses: actions/checkout@v4
        with:
          repository: IDKGameEngine/libidk
          ref: ${{ env.IDK_BRANCH }}
          path: libidk
          token: ${{ secrets.IDK_REPO_READ_TOKEN || github.token }}

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake \
            libgl-dev \
            ninja-build \
            pkg-config

      - name: Build third-party dependencies
        run: ./idk_build/script/local.sh

      # - name: Build Debug
      #   run: ./idk_build/script/build.sh --preset=debug

      - name: Build Release
        run: ./idk_build/script/build.sh --preset=release

      # - name: Upload Debug Build
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-debug
      #     path: build-debug/
      #     if-no-files-found: error

      - name: Upload Release Build
        uses: actions/upload-artifact@v4
        with:
          name: build-release
          path: build-release/
          if-no-files-found: error
